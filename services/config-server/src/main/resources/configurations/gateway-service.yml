spring:
  cloud:
    gateway:
      server:
        webflux:            # Spring Cloud Gateway 5.0 (2025.1.0) moved reactive config under server.webflux
          discovery:
            locator:
              enabled: true
          routes:
            - id: customer-service #id of routes
              uri: lb:http://CUSTOMER-SERVICE #lb->load balancer,redirect reuqest
              predicates: #predicates->condition to match the request
                - Path=/api/v1/customers/**
            - id: order-service
              uri: lb:http://ORDER-SERVICE
              predicates:
                - Path=/api/v1/order/**
            - id: order-lines-service
              uri: lb:http://ORDER-SERVICE
              predicates:
                - Path=/api/v1/order-lines/**
            - id: product-service
              uri: lb:http://PRODUCT-SERVICE
              predicates:
                - Path=/api/v1/products/**
            - id: payment-service
              uri: lb:http://PAYMENTS-SERVICE
              predicates:
                - Path=/api/v1/payments/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8222
