spring:
  datasource:
    url: jdbc:postgresql://localhost:5431/order
    username: shre
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: orderConfirmation:com.EcommMicro.kafka.OrderConfirmation

application:
  config:
     customer-url: http://localhost:8090/api/v1/customers
     product-url: http://localhost:8050/api/v1/products
     payment-url: http://localhost:8060/api/v1/payments



server:
   port: 8070

