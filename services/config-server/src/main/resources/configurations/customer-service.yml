spring:
  application:
    name: customer-service

  mongodb:
    uri: "mongodb://admin:password@localhost:27017/customer?authSource=admin"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO
    com.EcommMicro: DEBUG
    org.springframework.web: DEBUG

    org.hibernate.SQL: DEBUG

    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: 8090
