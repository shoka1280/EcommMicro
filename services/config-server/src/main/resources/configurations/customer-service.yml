spring:
  application:
    name: customer-service

  mongodb:
    uri: "mongodb://admin:password@localhost:27017/customer?authSource=admin"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO
    com.EcommMicro: DEBUG
    org.springframework.web: DEBUG

    org.hibernate.SQL: DEBUG

    org.hibernate.orm.jdbc.bind: TRACE
#Zipkin
management:
  tracing:
    sampling:
      probability: 1.0

    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
server:
  port: 8090
