#all other yml will inherit from here
eureka:
    instance:
      hostname: localhost
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
spring:
  cloud:
    config:
      override-system-properties: false

#Zipkin
management:
  tracing:
    sampling:
      probability: 1.0

    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans